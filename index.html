<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Club</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f4ee;
      color: #26231f;
    }
    .wrap { width: min(1000px, calc(100% - 32px)); margin: 64px auto; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 28px;
    }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(34px, 6vw, 54px); }
    .subtitle { color: #777066; margin-top: 7px; }
    button {
      border: 0; border-radius: 999px; padding: 12px 18px; cursor: pointer;
      font: inherit; font-weight: 700; background: #26231f; color: white;
    }
    button:hover { opacity: .86; }
    .book-list {
      background: #fff; border: 1px solid #e6e0d6; border-radius: 18px;
      overflow: hidden; box-shadow: 0 8px 30px rgba(40,32,20,.05);
    }
    .row {
      display: grid;
      grid-template-columns: 125px 2fr 1.5fr 1fr 130px;
      gap: 16px; align-items: center;
      padding: 19px 22px; border-bottom: 1px solid #eee9e0;
    }
    .row:last-child { border-bottom: 0; }
    .sort-head {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .sort-head:hover { color: #26231f; }
    .sort-head span { font-size: 11px; }

    .head {
      color: #91897d; font-size: 12px; text-transform: uppercase;
      letter-spacing: .08em; font-weight: 800; padding-top: 14px; padding-bottom: 14px;
    }
    .month { font-weight: 800; }
    .truncate {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
    }
    .title { font-family: Georgia, serif; font-size: 18px; font-weight: 700; }
    .muted { color: #756e64; }
    .rating { font-weight: 700; color: #756e64; }
    .empty { padding: 48px 20px; text-align: center; color: #8b8377; }
    #detailsDialog {
      max-width: calc(100vw - 30px);
      overflow: hidden;
    }
    #detailsDialog .modal {
      min-width: 0;
      overflow: hidden;
    }
    #detailsDialog .modal-top {
      min-width: 0;
      align-items: flex-start;
    }
    #detailsTitle {
      min-width: 0;
      max-width: calc(100% - 44px);
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    #detailsMeta {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    dialog {
      width: min(480px, calc(100% - 30px)); border: 0; border-radius: 20px;
      padding: 0; box-shadow: 0 24px 80px rgba(0,0,0,.22);
    }
    dialog::backdrop { background: rgba(24,20,15,.45); }
    .modal { padding: 26px; }
    .modal-top { display:flex; justify-content:space-between; align-items:center; }
    .modal h2 { margin: 0; font-family: Georgia, serif; font-size: 28px; }
    .close { background: transparent; color: #514b43; font-size: 24px; padding: 5px 8px; }
    .close:focus,
    .close:focus-visible {
      outline: none;
      box-shadow: none;
    }
    form { display:grid; gap: 15px; margin-top: 22px; }
    .date-fields { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display:grid; gap: 7px; font-size: 13px; font-weight: 750; }
    input, select {
      width: 100%; height: 46px; border: 1px solid #dcd5ca; background: #fcfbf8;
      border-radius: 11px; padding: 0 12px; font: inherit; color: inherit;
      appearance: none; -webkit-appearance: none;
    }
    select {
      background-image: linear-gradient(45deg, transparent 50%, #756e64 50%), linear-gradient(135deg, #756e64 50%, transparent 50%);
      background-position: calc(100% - 17px) 20px, calc(100% - 12px) 20px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 34px;
    }
    .submit { margin-top: 5px; }

    .rating-card {
      margin-top: 28px;
      padding: 22px;
      border-radius: 18px;
      background: #f8f1e6;
      border: 1px solid #eadfce;
    }
    .rating-bubble {
      display: block;
      min-width: 42px;
      color: #26231f;
      font-family: Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
      text-align: right;
    }
    .rating-bubble #ratingValue {
      display: inline;
      line-height: 1;
    }
    #ratingSlider {
      -webkit-appearance: none;
      appearance: none;
      height: 10px;
      border-radius: 999px;
      outline: none;
      background: linear-gradient(to right, #d6a86e 0%, #d6a86e 44%, #e8dfd2 44%, #e8dfd2 100%);
      padding: 0;
      border: 0;
      margin: 20px 0 9px !important;
    }
    #ratingSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #fffaf2;
      border: 3px solid #26231f;
      cursor: grab;
      box-shadow: 0 3px 9px rgba(38,35,31,.18);
    }
    #ratingSlider::-moz-range-thumb {
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: #fffaf2;
      border: 3px solid #26231f;
      cursor: grab;
      box-shadow: 0 3px 9px rgba(38,35,31,.18);
    }
    .rating-scale {
      display: flex;
      justify-content: space-between;
      color: #91897d;
      font-size: 12px;
      font-weight: 700;
    }

    #submitRating:disabled { cursor:default; opacity:.55; }

    .individual-ratings { margin-top:16px; display:grid; gap:7px; }
    .person-rating { display:flex;align-items:center;gap:12px;padding:9px 11px;background:#fffaf2;border:1px solid #eadfce;border-radius:10px; }
    .person-rating-name { min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .person-rating-score { font-weight:800;margin-left:auto; }
    .rating-delete { background:transparent;color:#9b4b42;padding:4px 6px;font-size:12px; }
    .clear-rating-btn:disabled {
      cursor: default;
      opacity: .4;
    }
    .clear-all-ratings-btn {
      width: 100%;
      margin-top: 8px;
      background: transparent;
      color: #91897d;
      padding: 9px;
      font-size: 13px;
    }
    .clear-all-ratings-btn:hover { color: #9b4b42; }

    .clear-rating-btn {
      width: 100%;
      margin-top: 8px;
      background: transparent;
      color: #91897d;
      padding: 9px;
      font-size: 13px;
    }
    .clear-rating-btn:hover { color: #9b4b42; }

    .details-delete-btn {
      width:100%; margin-top:4px; background:transparent; color:#9b4b42;
      border:1px solid #e4c9c4; padding:11px;
    }
    .details-delete-btn:hover { background:#fbf2f0; opacity:1; }
    .book-row { cursor: pointer; transition: background .15s ease; }
    .book-row:hover { background: #faf8f3; }

    .delete-btn {
      background: transparent;
      color: #9b4b42;
      padding: 7px 0;
      font-size: 13px;
      font-weight: 700;
    }
    .delete-btn:hover { opacity: .65; }

    @media (max-width: 760px) {
      .wrap { margin-top: 34px; }
      header { align-items:flex-start; flex-direction:column; }
      .head { display:none; }
      .row { grid-template-columns: 1fr; gap: 5px; padding: 19px; }
      .month { color:#91897d; font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>Book Club 📚</h1>
        <div class="subtitle">One book, one month, many opinions.</div>
      </div>
      <button id="addBtn">+ Add Book</button>
    </header>

    <section class="book-list" id="bookList"></section>
  </main>

  <dialog id="detailsDialog">
    <div class="modal">
      <div class="modal-top">
        <h2 id="detailsTitle">Book Details</h2>
        <button class="close" type="button" onclick="document.getElementById('detailsDialog').close()" aria-label="Close">×</button>
      </div>

      <div id="detailsMeta" style="margin-top:12px; line-height:1.7; color:#756e64;"></div>

      <a id="googleLink" target="_blank" rel="noopener noreferrer"
         style="display:inline-block; margin-top:16px; color:#26231f; font-weight:700;">
        Search on Google ↗
      </a>

      <div class="rating-card">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
          <input id="raterName" type="text" placeholder="Your name" maxlength="50" style="flex:1;min-width:0;background:#fffaf2;">
          <span class="rating-bubble"><span id="ratingValue">5</span></span>
        </div>
        <input id="ratingSlider" type="range" min="1" max="10" step="1" value="5"
               style="width:100%; margin:14px 0 8px;">
        <div class="rating-scale"><span>1 · meh</span><span>10 · loved it ♥</span></div>
        <button id="submitRating" type="button" style="width:100%;margin-top:18px;">Submit Rating</button>
        <div id="ratingSummary" style="text-align:center;margin-top:13px;color:#756e64;font-size:13px;"></div><div id="individualRatings" class="individual-ratings"></div>
      </div>
      <button id="clearRatings" type="button" class="clear-all-ratings-btn">Clear All Ratings</button>
      <button id="deleteBookBtn" type="button" class="details-delete-btn">Delete Book</button>
    </div>
  </dialog>

  <dialog id="bookDialog">
    <div class="modal">
      <div class="modal-top">
        <h2>Add a book</h2>
        <button class="close" id="closeBtn" type="button" aria-label="Close">×</button>
      </div>

      <form id="bookForm">
        <div class="date-fields">
          <label>Month
            <select id="month" required></select>
          </label>
          <label>Year
            <input id="year" type="number" min="1900" max="2200" required />
          </label>
        </div>

        <label>Book name
          <input id="bookName" type="text" placeholder="e.g. The Secret History" required />
        </label>

        <label>Author
          <input id="author" type="text" placeholder="e.g. Donna Tartt" required />
        </label>

        <label>Genre
          <input id="genre" type="text" placeholder="e.g. Literary fiction" required />
        </label>

        <button class="submit" type="submit">Add Book</button>
      </form>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://jlksctuscxthmzuqnhle.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WvHFKn3ga9PieaKsfaztUw_OnRdEpL_";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const months = [
      "January","February","March","April","May","June",
      "July","August","September","October","November","December"
    ];

    const monthSelect = document.getElementById("month");
    months.forEach((m, i) => {
      const option = document.createElement("option");
      option.value = i;
      option.textContent = m;
      monthSelect.appendChild(option);
    });

    const now = new Date();
    monthSelect.value = now.getMonth();
    document.getElementById("year").value = now.getFullYear();

    let books = [];

    async function loadBooks() {
      const { data: bookRows, error: booksError } = await supabaseClient
        .from("books")
        .select("*");

      if (booksError) {
        console.error(booksError);
        alert("Could not load books from the database.");
        return;
      }

      const { data: ratingRows, error: ratingsError } = await supabaseClient
        .from("ratings")
        .select("id,book_id,rating,rater_name");

      if (ratingsError) {
        console.error(ratingsError);
        alert("Could not load ratings from the database.");
        return;
      }

      books = (bookRows || []).map(book => ({
        ...book,
        ratings: (ratingRows || [])
          .filter(r => r.book_id === book.id)
          .map(r => ({ id:r.id, rating:Number(r.rating), rater_name:r.rater_name }))
      }));

      renderBooks();
    }

    let currentSort = "month-desc";

    function sortArrow(column) {
      if (!currentSort.startsWith(column)) return "↕";
      return currentSort.endsWith("asc") ? "↑" : "↓";
    }

    function changeSort(column) {
      if (currentSort.startsWith(column)) {
        currentSort = currentSort.endsWith("asc") ? `${column}-desc` : `${column}-asc`;
      } else {
        currentSort = column === "rating" || column === "month"
          ? `${column}-desc`
          : `${column}-asc`;
      }
      renderBooks();
    }

    function renderBooks() {
      const list = document.getElementById("bookList");

      if (!books.length) {
        list.innerHTML = '<div class="empty">No books yet — add your first book ✨</div>';
        return;
      }

      const sortMode = currentSort;
      const avgRating = book => {
        const ratings = book.ratings || [];
        return ratings.length ? ratings.reduce((a,b) => a + b.rating, 0) / ratings.length : null;
      };

      const sorted = [...books].sort((a, b) => {
        if (sortMode === "month-desc")
          return (b.year * 12 + b.month) - (a.year * 12 + a.month);
        if (sortMode === "month-asc")
          return (a.year * 12 + a.month) - (b.year * 12 + b.month);
        if (sortMode === "genre-asc")
          return a.genre.localeCompare(b.genre, undefined, { sensitivity: "base" });
        if (sortMode === "genre-desc")
          return b.genre.localeCompare(a.genre, undefined, { sensitivity: "base" });

        const ar = avgRating(a);
        const br = avgRating(b);

        // Unrated books stay at the bottom for either rating sort.
        if (ar === null && br === null) return 0;
        if (ar === null) return 1;
        if (br === null) return -1;
        return sortMode === "rating-asc" ? ar - br : br - ar;
      });

      list.innerHTML = `
        <div class="row head">
          <div class="sort-head" onclick="changeSort('month')">Month <span>${sortArrow('month')}</span></div>
          <div>Book</div>
          <div>Author</div>
          <div class="sort-head" onclick="changeSort('genre')">Genre <span>${sortArrow('genre')}</span></div>
          <div class="sort-head" onclick="changeSort('rating')">Rating <span>${sortArrow('rating')}</span></div>
        </div>
      ` + sorted.map(book => `
        <div class="row book-row" onclick="openBookDetails(${book.month}, ${book.year})">
          <div class="month">${months[book.month].slice(0,3).toUpperCase()} ${book.year}</div>
          <div class="title truncate" title="${escapeHtml(book.name)}">${escapeHtml(book.name)}</div>
          <div class="muted truncate" title="${escapeHtml(book.author)}">${escapeHtml(book.author)}</div>
          <div class="muted truncate" title="${escapeHtml(book.genre)}">${escapeHtml(book.genre)}</div>
          <div class="rating">${book.ratings && book.ratings.length ? "★ " + (book.ratings.reduce((a,b)=>a+b.rating,0)/book.ratings.length).toFixed(1) : "Not rated yet"}</div>
        </div>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
      })[char]);
    }

    let activeBook = null;

    function openBookDetails(month, year) {
      activeBook = books.find(b => b.month === month && b.year === year);
      if (!activeBook) return;

      activeBook.ratings = activeBook.ratings || [];
      document.getElementById("detailsTitle").textContent = activeBook.name;
      document.getElementById("detailsMeta").innerHTML =
        `<strong>${escapeHtml(activeBook.author)}</strong><br>` +
        `${escapeHtml(activeBook.genre)} · ${months[activeBook.month]} ${activeBook.year}`;

      const query = encodeURIComponent(`${activeBook.name} ${activeBook.author} book`);
      document.getElementById("googleLink").href = `https://www.google.com/search?q=${query}`;
      updateRatingSummary();

      const submitButton = document.getElementById("submitRating");
      submitButton.disabled = false;
      submitButton.textContent = "Submit Rating";
      document.getElementById("raterName").value = "";


      const slider = document.getElementById("ratingSlider");
      slider.value = 5;
      document.getElementById("ratingValue").textContent = slider.value;
      updateSliderLook(slider);
      document.getElementById("detailsDialog").showModal();
    }

    function updateRatingSummary() {
      const ratings=activeBook?.ratings||[], summary=document.getElementById("ratingSummary"), list=document.getElementById("individualRatings");
      if(!ratings.length){ summary.textContent="Not rated yet"; list.innerHTML=""; return; }
      const avg=ratings.reduce((a,b)=>a+b.rating,0)/ratings.length;
      summary.textContent=`Average: ${avg.toFixed(1)} / 10 · ${ratings.length} rating${ratings.length===1?"":"s"}`;
      list.innerHTML=ratings.map(r=>`<div class="person-rating"><span class="person-rating-name">${escapeHtml(r.rater_name||"Anonymous")}</span><span class="person-rating-score">${r.rating}/10</span><button class="rating-delete" type="button" onclick="deleteRating(${r.id})">Delete</button></div>`).join("");
    }
    async function deleteRating(id) {
      if(!activeBook)return; const bookId=activeBook.id;
      const {error}=await supabaseClient.from("ratings").delete().eq("id",id);
      if(error){console.error(error);alert("Could not delete rating.");return;}
      await loadBooks(); activeBook=books.find(b=>b.id===bookId); updateRatingSummary();
    }

    function updateSliderLook(slider) {
      const pct = ((Number(slider.value) - 1) / 9) * 100;
      slider.style.background =
        `linear-gradient(to right, #d6a86e 0%, #d6a86e ${pct}%, #e8dfd2 ${pct}%, #e8dfd2 100%)`;
    }

    document.getElementById("ratingSlider").addEventListener("input", e => {
      document.getElementById("ratingValue").textContent = e.target.value;
      updateSliderLook(e.target);
    });

    document.getElementById("submitRating").addEventListener("click", async () => {
      if (!activeBook) return;

      const rating=Number(document.getElementById("ratingSlider").value);
      const raterName=document.getElementById("raterName").value.trim();
      if(!raterName){alert("Please enter your name.");document.getElementById("raterName").focus();return;}
      const {error}=await supabaseClient.from("ratings").insert({book_id:activeBook.id,rating,rater_name:raterName});

      if (error) {
        console.error(error);
        alert("Could not save rating.");
        return;
      }

      await loadBooks();
      activeBook = books.find(b => b.id === activeBook.id);
      updateRatingSummary();

      const submitButton = document.getElementById("submitRating");
      submitButton.disabled = true;
      submitButton.textContent = "Rating Submitted ✓";

    });


    document.getElementById("clearRatings").addEventListener("click", async () => {
      if (!activeBook) return;

      const { error } = await supabaseClient
        .from("ratings")
        .delete()
        .eq("book_id", activeBook.id);

      if (error) {
        console.error(error);
        alert("Could not clear ratings.");
        return;
      }

      await loadBooks();
      activeBook = books.find(b => b.id === activeBook.id);
      updateRatingSummary();
    });

    async function deleteBook() {
      if (!activeBook) return;
      const { error } = await supabaseClient.from("books").delete().eq("id", activeBook.id);
      if (error) { console.error(error); alert("Could not delete book."); return; }
      document.getElementById("detailsDialog").close();
      activeBook = null;
      await loadBooks();
    }

    document.getElementById("deleteBookBtn").addEventListener("click", deleteBook);

    const dialog = document.getElementById("bookDialog");
    document.getElementById("addBtn").onclick = () => dialog.showModal();
    document.getElementById("closeBtn").onclick = () => dialog.close();

    dialog.addEventListener("click", e => {
      if (e.target === dialog) dialog.close();
    });

    const detailsDialog = document.getElementById("detailsDialog");
    detailsDialog.addEventListener("click", e => {
      if (e.target === detailsDialog) detailsDialog.close();
    });

    document.getElementById("bookForm").addEventListener("submit", async e => {
      e.preventDefault();

      const newBook = {
        month: Number(monthSelect.value),
        year: Number(document.getElementById("year").value),
        name: document.getElementById("bookName").value.trim(),
        author: document.getElementById("author").value.trim(),
        genre: document.getElementById("genre").value.trim()
      };

      const existing = books.find(b => b.month === newBook.month && b.year === newBook.year);
      if (existing) {
        alert("There is already a book for that month.");
        return;
      }

      const { error } = await supabaseClient
        .from("books")
        .insert(newBook);

      if (error) {
        console.error(error);
        alert("Could not add book.");
        return;
      }

      await loadBooks();

      e.target.reset();
      monthSelect.value = now.getMonth();
      document.getElementById("year").value = now.getFullYear();
      dialog.close();
    });

    loadBooks();
  </script>
</body>
</html>
